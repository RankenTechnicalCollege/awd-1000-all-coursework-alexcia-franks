<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Survey</title>
    <link rel="stylesheet" href="css/music-styles.css">
</head>
<body>


<main>
    <div id="survey">
        <div id="form">
            <form class="form-grid">
                <h1>Music Survey</h1>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="text" id="email" name="email">

        <fieldset>
            <legend>Select your favorite music genre</legend>

            <label for="rock">Rock&nbsp;
            <input type="radio" id="rock" name="favorite-genre"></label>

            <label for="pop">Pop&nbsp;
            <input type="radio" id="pop" name="favorite-genre"></label>

            <label for="hiphop">Hip Hop&nbsp;
            <input type="radio" id="hiphop" name="favorite-genre"></label>

            <label for="electric">Electric&nbsp;
            <input type="radio" id="electric" name="favorite-genre"></label>

            <label for="jazz">Jazz&nbsp;
            <input type="radio" id="jazz" name="favorite-genre"></label>

             <label for="classical">Classical&nbsp;
            <input type="radio" id="classical" name="favorite-genre"></label>

             <label for="country">Country&nbsp;
            <input type="radio" id="country" name="favorite-genre"></label>


             <label for="r-and-b">R&amp;B&nbsp;
            <input type="radio" id="r-and-b" name="favorite-genre"></label>


             <label for="other-genre">Other&nbsp;
            <input type="radio" id="other-genre" name="favorite-genre"></label>
    </fieldset>

    <fieldset>
    
        <legend>Select what music services that you use (one or more)</legend>

        <label for="spotify">Spotify&nbsp;
        <input type="checkbox" id="spotify" name="spotify"></label>

        <label for="apple-music">Apple Music&nbsp;
        <input type="checkbox" id="apple-music" name="apple-music"></label>

        <label for="amazon">Amazon Music&nbsp;
        <input type="checkbox" id="amazon" name="amazon"></label>

        <label for="youtube">YouTube Music&nbsp;
        <input type="checkbox" id="youtube" name="youtube"></label>

        <label for="siriusXM">SiriusXM&nbsp;
        <input type="checkbox" id="siriusXM" name="siriusXM"></label>

        <label for="tidal">TIDAL&nbsp;
        <input type="checkbox" id="tidal" name="tidal"></label>

        <label for="qobuz">Qobuz&nbsp;
        <input type="checkbox" id="qobuz" name="qobuz"></label>

        <label for="pandora">Pandora&nbsp;
        <input type="checkbox" id="pandora" name="pandora"></label>

        <label for="iHeart">iHeart Radio&nbsp;
        <input type="checkbox" id="iHeart" name="iHeart"></label>

        <label for="deezer">Deezer&nbsp;
        <input type="checkbox" id="deezer" name="deezer"></label>

        <label for="soundcloud">SoundCloud&nbsp;
        <input type="checkbox" id="soundcloud" name="soundcloud"></label>

        <label for="other-service">Other&nbsp;
        <input type="checkbox" id="other-service" name="other-service"></label>
    </fieldset>

    <label for="reflect">What does music do for you?</label>
    <textarea id="reflect" name="reflect" rows="3" cols="100"></textarea>

    <label for="feedback">What's your favorite song and what does it mean to you?</label>
    <textarea id="feedback" name="feedback" rows="3" cols="100"></textarea>

    <div>
    <button type="submit" class="btn">Submit</button>
    <button type="reset" class="btn">Reset</button>
    </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
